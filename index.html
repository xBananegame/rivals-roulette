<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Rivals Roulette</title>
<style>
  :root{
    --bg:#0b0920;
    --panel:rgba(23,18,56,.88);
    --line:rgba(255,255,255,.16);
    --ink:#f5f3ff;
    --muted:#a9a3cf;
    --gold:#ffd542;
    --van:#ffb020;
    --duel:#ff4d6b;
    --strat:#2fd6c3;
    --flex:#a06bff;
    --ok:#37c268;
    --part:#e5b63a;
    --no:#d5455a;
    --cut:polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px);
    --slash:polygon(12px 0, 100% 0, calc(100% - 12px) 100%, 0 100%);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:
      radial-gradient(1.5px 1.5px at 18% 22%, rgba(255,255,255,.5), transparent 60%),
      radial-gradient(1px 1px at 72% 12%, rgba(255,255,255,.4), transparent 60%),
      radial-gradient(1.5px 1.5px at 88% 64%, rgba(255,255,255,.35), transparent 60%),
      radial-gradient(1px 1px at 34% 82%, rgba(255,255,255,.35), transparent 60%),
      radial-gradient(1px 1px at 55% 45%, rgba(255,255,255,.28), transparent 60%),
      linear-gradient(115deg, transparent 42%, rgba(160,107,255,.08) 46%, rgba(160,107,255,.08) 52%, transparent 56%),
      linear-gradient(115deg, transparent 60%, rgba(47,214,195,.06) 66%, rgba(47,214,195,.06) 70%, transparent 76%),
      radial-gradient(1100px 640px at 80% -10%, rgba(122,72,255,.32), transparent 62%),
      radial-gradient(900px 560px at -12% 34%, rgba(48,36,120,.5), transparent 60%),
      radial-gradient(980px 600px at 55% 115%, rgba(255,77,107,.14), transparent 60%),
      linear-gradient(180deg,#141031, var(--bg) 55%);
    background-attachment:fixed;
    color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    overflow-x:hidden;min-height:100dvh;
  }
  .wrap{max-width:640px;margin:0 auto;padding:16px 16px calc(28px + env(safe-area-inset-bottom));min-height:100dvh;display:flex;flex-direction:column}

  .display{
    font-family:"Arial Black","Helvetica Neue",Arial,sans-serif;
    font-weight:900;font-style:italic;
    text-transform:uppercase;letter-spacing:-.015em;line-height:.97;
  }

  .frame{position:relative;background:var(--panel);border:1px solid var(--line);clip-path:var(--cut)}
  .frame::before{content:"";position:absolute;top:0;left:0;width:34px;height:3px;background:var(--gold)}
  .frame::after{content:"";position:absolute;bottom:0;right:0;width:34px;height:3px;background:var(--gold)}

  /* ---------- Screens ---------- */
  .screen{display:none;flex-direction:column;flex:1;animation:screenIn .34s cubic-bezier(.22,.9,.3,1) both}
  .screen.active{display:flex}
  @keyframes screenIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

  /* ---------- Topbar ---------- */
  .topbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;min-height:42px}
  .icon-btn{
    background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--ink);
    width:42px;height:42px;clip-path:var(--cut);font-size:18px;cursor:pointer;
    display:grid;place-items:center;transition:background .15s, transform .12s;
    font-family:inherit;font-weight:800;
  }
  .icon-btn:active{transform:scale(.92);background:rgba(255,255,255,.12)}
  .icon-btn.lang{font-size:12px;letter-spacing:.08em}
  .screen-title{font-size:20px;flex:1}
  .screen-title .tint{color:var(--tint,var(--gold))}
  .top-right{margin-left:auto;display:flex;gap:10px}

  /* ---------- Home ---------- */
  #home .hero{margin:16px 0 4px}
  .kicker{
    display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.32em;text-transform:uppercase;
    color:var(--bg);background:var(--gold);padding:6px 14px;clip-path:var(--slash);margin-bottom:14px;
  }
  .logo{font-size:min(14.5vw,60px)}
  .logo .l2{display:block;background:linear-gradient(92deg,var(--gold),#ff9d3c 60%,var(--duel));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 3px 0 rgba(0,0,0,.45))}
  .sub{color:var(--muted);font-size:14.5px;line-height:1.55;margin-top:12px;max-width:40ch}

  .menu{display:flex;flex-direction:column;gap:14px;margin-top:26px}
  .menu-card{
    text-align:left;cursor:pointer;color:var(--ink);font-family:inherit;
    padding:18px 16px;overflow:hidden;transition:transform .15s ease;
    animation:cardIn .45s cubic-bezier(.22,.9,.3,1) both;
  }
  .menu-card:nth-child(2){animation-delay:.06s}
  .menu-card:nth-child(3){animation-delay:.12s}
  @keyframes cardIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  .menu-card:hover{transform:translateY(-3px)}
  .menu-card:active{transform:scale(.975)}
  .menu-card .beam{
    position:absolute;inset:-40% auto -40% -16%;width:34%;
    background:linear-gradient(180deg,var(--c1),transparent 85%);
    transform:skewX(-18deg);opacity:.22;pointer-events:none;transition:opacity .2s;
  }
  .menu-card:hover .beam{opacity:.36}
  .menu-card .glyph{
    position:relative;width:50px;height:50px;clip-path:var(--cut);margin-bottom:12px;
    background:linear-gradient(140deg,var(--c1),rgba(0,0,0,.35));
    display:grid;place-items:center;font-size:24px;
  }
  .menu-card h2{position:relative;font-size:21px;margin-bottom:5px}
  .menu-card h2 span{color:var(--c1)}
  .menu-card p{position:relative;color:var(--muted);font-size:13px;line-height:1.5}
  .card-wheel{--c1:var(--gold)}
  .card-strat{--c1:var(--strat)}
  .card-guess{--c1:var(--duel)}

  .roster-note{margin-top:auto;padding-top:24px;text-align:center;color:var(--muted);font-size:11px;letter-spacing:.05em;line-height:1.7}

  /* ---------- Wheel-Layout ---------- */
  .wheel-layout{display:flex;flex-direction:column}
  .mode-toggle{display:flex;border:1px solid var(--line);clip-path:var(--cut);overflow:hidden;margin-bottom:6px;background:rgba(255,255,255,.04)}
  .mode-toggle button{
    flex:1;border:none;background:transparent;padding:11px 8px;cursor:pointer;color:var(--muted);
    font-family:inherit;font-weight:800;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;
    transition:background .15s,color .15s;
  }
  .mode-toggle button.on{background:var(--gold);color:var(--bg)}
  .mode-hint{color:var(--muted);font-size:11.5px;text-align:center;margin-bottom:10px;min-height:15px}

  .legend{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:2px 0 12px}
  .legend span{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;font-weight:600}
  .dot{width:9px;height:9px;transform:rotate(45deg)}

  .wheel-stage{position:relative;display:grid;place-items:center;margin:2px 0 16px}
  .wheel-glow{
    position:absolute;width:var(--wheel-size,min(86vw,400px));aspect-ratio:1;border-radius:50%;
    background:conic-gradient(var(--gold),var(--duel),var(--flex),var(--strat),var(--gold));
    filter:blur(30px);opacity:.28;animation:pulse 4.5s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:.22;transform:scale(.97)}50%{opacity:.36;transform:scale(1.01)}}
  canvas#wheel{position:relative;width:var(--wheel-size,min(86vw,400px));height:auto;display:block;border-radius:50%}
  .pointer{
    position:absolute;top:-7px;left:50%;transform:translateX(-50%);z-index:3;
    width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;
    border-top:25px solid var(--gold);
    filter:drop-shadow(0 3px 5px rgba(0,0,0,.7));transform-origin:50% 0;
  }
  .pointer.wobble{animation:wobble .5s ease-out}
  @keyframes wobble{0%{transform:translateX(-50%) rotate(0)}25%{transform:translateX(-50%) rotate(-9deg)}55%{transform:translateX(-50%) rotate(6deg)}100%{transform:translateX(-50%) rotate(0)}}
  .hub{
    position:absolute;z-index:2;width:76px;height:76px;border-radius:50%;
    background:radial-gradient(circle at 32% 28%,#332a66,#131028 70%);
    border:2px solid var(--line);display:grid;place-items:center;text-align:center;
    color:var(--muted);font-size:9.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;
    pointer-events:none;
  }
  .hub b{color:var(--gold);font-size:19px;letter-spacing:0;font-style:italic}

  /* ---------- Buttons ---------- */
  .btn{
    border:none;cursor:pointer;color:var(--bg);
    font-family:inherit;font-weight:900;font-style:italic;font-size:15px;letter-spacing:.06em;text-transform:uppercase;
    padding:15px 26px;clip-path:var(--slash);
    background:linear-gradient(95deg,var(--gold),#ffb43c);
    transition:transform .13s ease, filter .13s ease;
    -webkit-user-select:none;user-select:none;
  }
  
  .btn:hover{filter:brightness(1.08)}
  .btn:active{transform:scale(.96)}
  .btn:disabled{filter:grayscale(.7) brightness(.55);cursor:default}
  .btn.big{width:100%;padding:17px;font-size:16.5px}
  .btn.teal{background:linear-gradient(95deg,var(--strat),#3fa4ff)}
  .btn.red{background:linear-gradient(95deg,var(--duel),#ff7a4d)}
  .btn.ghost{
    background:rgba(255,255,255,.06);color:var(--ink);border:1px solid var(--line);
    clip-path:var(--cut);font-style:normal;font-size:12.5px;padding:12px 14px;font-weight:700;
  }
  .btn:focus-visible,.icon-btn:focus-visible,.menu-card:focus-visible,.mode-toggle button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

  .actions{display:flex;flex-direction:column;gap:10px}
  .actions-row{display:flex;gap:10px}
  .actions-row .btn{flex:1}

  /* ---------- Avatar ---------- */
  .avatar{
    flex:none;width:58px;height:58px;clip-path:var(--cut);
    background:linear-gradient(145deg,var(--ac,var(--gold)) 0%, rgba(0,0,0,.55) 130%);
    display:grid;place-items:center;overflow:hidden;position:relative;
  }
  .avatar span{
    font-family:"Arial Black",Arial,sans-serif;font-weight:900;font-style:italic;
    font-size:21px;color:rgba(10,8,26,.9);letter-spacing:-.03em;
  }
  .avatar img{width:100%;height:100%;object-fit:cover;object-position:top center}
  .avatar.sm{width:42px;height:42px}
  .avatar.sm span{font-size:15px}
  .avatar.lg{width:84px;height:84px}
  .avatar.lg span{font-size:30px}
  .avatar.xl{width:128px;height:128px}
  .avatar.xl span{font-size:44px}
  .avatar.xs{width:24px;height:24px}
  .avatar.xs span{font-size:9px}
  .avatar.fill{width:100%;height:auto;aspect-ratio:1}
  .avatar.fill span{font-size:clamp(22px,5vw,40px)}

  /* ---------- Hintergrund-Slideshow (Maps) ---------- */
  .bg-slides{position:fixed;inset:0;z-index:-1;display:none}
  body.has-bg{background:#0b0920}
  body.has-bg .bg-slides{display:block}
  .bg-slides img{
    position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    opacity:0;transition:opacity 2.5s ease;
  }
  .bg-slides img.on{opacity:1}
  .bg-slides::after{ /* dunkler Schleier, damit die UI lesbar bleibt */
    content:"";position:absolute;inset:0;
    background:
      radial-gradient(1100px 640px at 80% -10%, rgba(122,72,255,.25), transparent 62%),
      linear-gradient(180deg, rgba(15,11,38,.88), rgba(11,9,32,.93));
  }

  /* ---------- Ausgelassen ---------- */
  .bench{margin-top:16px}
  .bench-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .bench-head h3{font-size:10.5px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
  .bench-head button{background:none;border:none;color:var(--gold);font-family:inherit;font-weight:800;font-size:11.5px;cursor:pointer;letter-spacing:.06em;text-transform:uppercase;padding:4px}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{
    background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--ink);
    font-family:inherit;font-size:12px;padding:6px 10px;clip-path:var(--cut);cursor:pointer;
    display:flex;align-items:center;gap:6px;animation:chipIn .22s ease both;
  }
  @keyframes chipIn{from{opacity:0;transform:scale(.8)}to{opacity:1}}
  .chip i{font-style:normal;color:var(--duel);font-size:11px;font-weight:900}
  .bench-empty{color:var(--muted);font-size:12.5px;line-height:1.5}

  /* ---------- Result-Sheet ---------- */
  .sheet-backdrop{
    position:fixed;inset:0;background:rgba(5,4,16,.7);backdrop-filter:blur(4px);
    opacity:0;pointer-events:none;transition:opacity .25s;z-index:20;
  }
  .sheet-backdrop.show{opacity:1;pointer-events:auto}
  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:21;
    max-width:560px;margin:0 auto;
    background:linear-gradient(180deg,#1d1745,#120e2c);
    border:1px solid var(--line);border-bottom:none;
    clip-path:polygon(0 22px, 22px 0, calc(100% - 22px) 0, 100% 22px, 100% 100%, 0 100%);
    padding:20px 22px calc(24px + env(safe-area-inset-bottom));
    transform:translateY(110%);transition:transform .42s cubic-bezier(.2,1.1,.3,1);
  }
  .sheet.show{transform:none}
  @media (min-width:900px){
    .sheet{bottom:50%;transform:translateY(120vh);border-bottom:1px solid var(--line);
      clip-path:polygon(0 22px, 22px 0, calc(100% - 22px) 0, 100% 22px, 100% calc(100% - 22px), calc(100% - 22px) 100%, 22px 100%, 0 calc(100% - 22px))}
    .sheet.show{transform:translateY(50%)}
  }
  .grip{width:44px;height:4px;background:var(--line);margin:0 auto 16px}
  .result-top{display:flex;gap:14px;align-items:center;margin-bottom:12px}
  .role-badge{
    display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;
    color:var(--bg);background:var(--rb,var(--gold));padding:5px 11px;clip-path:var(--slash);margin-bottom:8px;
  }
  .result-name{font-size:min(8.5vw,34px);
    animation:nameIn .45s cubic-bezier(.2,1.2,.3,1) both .05s}
  @keyframes nameIn{from{opacity:0;transform:translateY(12px) skewX(-8deg)}to{opacity:1;transform:skewX(0)}}
  .result-info{color:var(--muted);font-size:14.5px;line-height:1.55;margin-bottom:18px}

  /* ---------- StratRoulette ---------- */
  .strat-stage{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;padding-bottom:8px;width:100%}
  .strat-idle{text-align:center;color:var(--muted);font-size:14.5px;line-height:1.6}
  .strat-idle .big-icon{font-size:52px;display:block;margin-bottom:12px;animation:float 3.2s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-8px) rotate(4deg)}}
  .shuffler{display:none;text-align:center;padding:32px 12px;border:1px dashed var(--line);clip-path:var(--cut);background:rgba(255,255,255,.03)}
  .shuffler.show{display:block}
  .shuffler .cycling{font-size:22px;color:var(--muted)}
  .strat-card{display:none;padding:22px 18px}
  .strat-card.show{display:block;animation:stratPop .45s cubic-bezier(.2,1.25,.3,1) both}
  @keyframes stratPop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
  .strat-tag{font-size:10px;font-weight:800;letter-spacing:.28em;text-transform:uppercase;color:var(--strat);margin-bottom:10px}
  .strat-title{font-size:min(7.5vw,29px);margin-bottom:10px}
  .strat-desc{color:var(--muted);font-size:14.5px;line-height:1.6;margin-bottom:14px}
  .strat-desc b{color:var(--ink)}
  .strat-heroes{display:flex;flex-wrap:wrap;gap:7px}
  .hero-tag{font-size:11.5px;padding:4px 9px;border:1px solid var(--line);clip-path:var(--cut);background:rgba(255,255,255,.04);color:var(--ink)}
  .hero-tag.with-img{display:inline-flex;align-items:center;gap:7px;padding:4px 10px 4px 5px}

  /* ---------- Helden-Galerie ---------- */
  .gal-filter{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .gal-filter button{
    background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--muted);
    font-family:inherit;font-weight:800;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;
    padding:9px 14px;clip-path:var(--cut);cursor:pointer;transition:background .15s,color .15s;
  }
  .gal-filter button.on{background:var(--gold);color:var(--bg);border-color:transparent}
  .gallery-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:12px;padding-bottom:12px;
  }
  .gal-card{
    background:var(--panel);border:1px solid var(--line);clip-path:var(--cut);
    padding:8px 8px 10px;cursor:pointer;color:var(--ink);font-family:inherit;text-align:center;
    transition:transform .14s;animation:cardIn .35s ease both;
  }
  .gal-card:hover{transform:translateY(-3px)}
  .gal-card:active{transform:scale(.96)}
  .gal-card .name{display:block;font-size:11px;font-weight:700;margin-top:8px;line-height:1.25;min-height:2.4em}
  .gal-card .role{display:block;font-size:9px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;margin-top:3px;color:var(--rc)}
  .gal-count{color:var(--muted);font-size:11.5px;margin-bottom:12px}

  /* ---------- Helden-Detail ---------- */
  .hero-detail-top{display:flex;gap:16px;align-items:center;margin-bottom:14px}
  .stats{border-top:1px solid var(--line);margin-top:4px}
  .stat-row{display:flex;justify-content:space-between;gap:14px;padding:9px 2px;border-bottom:1px solid rgba(255,255,255,.08);font-size:13px}
  .stat-row .k{color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:10.5px;padding-top:2px}
  .stat-row .v{text-align:right;color:var(--ink);font-weight:600}
  .detail-sub{font-size:10px;font-weight:800;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
  .sheet-scroll{max-height:min(72dvh,640px);overflow-y:auto;overscroll-behavior:contain;padding-right:4px}
  .ab-row{padding:8px 2px;border-bottom:1px solid rgba(255,255,255,.08)}
  .ab-row b{display:block;font-size:12.5px;color:var(--gold);margin-bottom:2px}
  .ab-row span{font-size:12.5px;color:var(--muted);line-height:1.45}

  /* ---------- Bibliothek ---------- */
  .lib-intro{color:var(--muted);font-size:13.5px;line-height:1.55;margin-bottom:16px}
  .lib-list{display:flex;flex-direction:column;gap:12px;padding-bottom:10px}
  .lib-card{padding:16px;animation:cardIn .4s ease both}
  .lib-num{
    display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 6px;
    background:var(--gold);color:var(--bg);clip-path:var(--slash);
    font-weight:900;font-style:italic;font-size:12px;margin-bottom:8px;
  }
  .lib-card h3{font-size:17px;margin-bottom:6px}
  .lib-card p{color:var(--muted);font-size:13.5px;line-height:1.55}
  .lib-card p b{color:var(--ink)}
  .lib-card .strat-heroes{margin-top:10px}

  /* ---------- Guess ---------- */
  .guess-status{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
  .tries{padding:10px 14px;font-size:12px;color:var(--muted);flex:1;min-width:120px}
  .tries b{color:var(--gold);font-size:16px;font-style:italic;font-family:"Arial Black",Arial,sans-serif}
  .guess-search{position:relative;margin-bottom:14px;z-index:5}
  .guess-search input{
    width:100%;padding:15px 16px;background:rgba(255,255,255,.05);
    border:1px solid var(--line);clip-path:var(--cut);
    color:var(--ink);font-family:inherit;font-size:15px;outline:none;
  }
  .guess-search input:focus{border-color:var(--gold);background:rgba(255,255,255,.08)}
  .guess-search input::placeholder{color:var(--muted)}
  .suggestions{
    position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:6;
    background:#1c1642;border:1px solid var(--line);clip-path:var(--cut);
    max-height:min(50vh, 420px);overflow-y:auto;display:none;
    overscroll-behavior:contain;
  }
  .suggestions.show{display:block}
  .sugg{
    display:flex;align-items:center;gap:10px;width:100%;text-align:left;
    background:none;border:none;border-bottom:1px solid rgba(255,255,255,.07);
    padding:8px 12px;color:var(--ink);font-family:inherit;font-size:14px;cursor:pointer;
  }
  .sugg:hover,.sugg:focus{background:rgba(255,213,66,.12)}
  .sugg .role-mini{margin-left:auto;font-size:9.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

  .guess-banner{display:none;padding:18px 16px;margin-bottom:14px;text-align:center}
  .guess-banner.show{display:block;animation:stratPop .45s cubic-bezier(.2,1.25,.3,1) both}
  .guess-banner h3{font-size:22px;margin:10px 0 6px}
  .guess-banner h3 span{color:var(--gold)}
  .guess-banner p{color:var(--muted);font-size:13.5px;line-height:1.55;margin-bottom:14px}
  .guess-banner .avatar{margin:0 auto}

  .guess-legend{display:flex;gap:12px;flex-wrap:wrap;margin:2px 0 12px}
  .guess-legend span{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--muted)}
  .guess-legend .sq{width:11px;height:11px;clip-path:var(--cut)}

  .board-scroll{overflow-x:auto;padding-bottom:14px;-webkit-overflow-scrolling:touch}
  .board{min-width:760px}
  .board-head,.board-row{
    display:grid;grid-template-columns:130px 66px 84px 104px 76px 78px 52px 64px 62px;gap:6px;margin-bottom:6px;
  }
  .board-head span{
    font-size:9.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
    border-bottom:2px solid var(--line);padding:0 4px 6px;
  }
  .cell{
    min-height:58px;display:flex;align-items:center;justify-content:center;text-align:center;
    font-size:11.5px;font-weight:700;line-height:1.25;padding:4px 5px;
    clip-path:var(--cut);color:#0d0a20;
    animation:flip .4s ease both;
  }
  .board-row .cell:nth-child(2){animation-delay:.08s}
  .board-row .cell:nth-child(3){animation-delay:.16s}
  .board-row .cell:nth-child(4){animation-delay:.24s}
  .board-row .cell:nth-child(5){animation-delay:.32s}
  .board-row .cell:nth-child(6){animation-delay:.40s}
  .board-row .cell:nth-child(7){animation-delay:.48s}
  .board-row .cell:nth-child(8){animation-delay:.56s}
  .board-row .cell:nth-child(9){animation-delay:.64s}
  @keyframes flip{from{opacity:0;transform:rotateX(80deg)}to{opacity:1;transform:none}}
  .cell.hero{
    justify-content:flex-start;gap:8px;text-align:left;font-size:11px;border:1px solid var(--line);
  }
  .cell.hero.ok{background:var(--ok);color:#0d0a20}
  .cell.hero.no{background:rgba(255,255,255,.05);color:var(--ink)}
  .cell.ok{background:var(--ok)}
  .cell.part{background:var(--part)}
  .cell.no{background:var(--no);color:#fff}
  .cell .arrow{font-size:14px;margin-left:3px}
  .guess-hint{color:var(--muted);font-size:11.5px;line-height:1.6;margin-top:2px}

  /* =============================================
     DESKTOP-LAYOUT (Browser-first)
     ============================================= */
  @media (min-width:900px){
    .wrap{max-width:1100px;padding:32px 40px 48px}
    .screen-title{font-size:26px}

    /* Home */
    #home .hero{margin:34px 0 10px;text-align:center}
    #home .sub{margin:14px auto 0;max-width:52ch}
    .logo{font-size:76px}
    .logo .l2{display:inline;margin-left:14px}
    .menu{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-top:44px}
    .menu-card{padding:26px 22px}
    .menu-card h2{font-size:23px}
    .menu-card p{font-size:13.5px}
    .gallery-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
    .gal-card .name{font-size:12.5px}
    .avatar.xl{width:150px;height:150px}

    /* Wheel: zweispaltig */
    .wheel-layout{display:grid;grid-template-columns:auto 1fr;gap:44px;align-items:start}
    .wheel-left{--wheel-size:440px}
    .wheel-right{display:flex;flex-direction:column;padding-top:6px}
    .legend{justify-content:flex-start;margin-bottom:16px}
    .mode-hint{text-align:left}
    .bench{margin-top:22px}

    /* Strat */
    .strat-stage{max-width:660px;margin:0 auto;justify-content:flex-start;padding-top:26px}

    /* Bibliothek */
    .lib-list{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}

    /* Guess */
    .board{min-width:0}
    .board-head,.board-row{grid-template-columns:1.6fr .8fr .95fr 1.2fr .9fr .9fr .6fr .75fr .7fr}
    .cell{font-size:12.5px}
    .cell.hero{font-size:12.5px}
    .guess-hint .mobile-only{display:none}
  }

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
  }
</style>
</head>
<body>
<div class="bg-slides" id="bgSlides" aria-hidden="true"></div>
<div class="wrap">

  <!-- ============ HOME ============ -->
  <section class="screen active" id="home">
    <div class="topbar" style="justify-content:flex-end;margin-bottom:0">
      <div class="top-right">
        <button class="icon-btn lang lang-btn" onclick="toggleLang()">EN</button>
        <button class="icon-btn sound-btn" onclick="toggleSound()" aria-label="Sound">🔊</button>
      </div>
    </div>
    <div class="hero">
      <div class="kicker">Marvel Rivals Tool</div>
      <h1 class="display logo">Rivals<span class="l2">Roulette</span></h1>
      <p class="sub" data-i18n="homeSub"></p>
    </div>

    <div class="menu">
      <button class="menu-card frame card-wheel" onclick="showScreen('wheelScreen')">
        <span class="beam"></span>
        <span class="glyph">🎡</span>
        <h2 class="display" data-i18n="menuWheelTitle"></h2>
        <p data-i18n="menuWheelDesc"></p>
      </button>
      <button class="menu-card frame card-strat" onclick="showScreen('stratScreen')">
        <span class="beam"></span>
        <span class="glyph">🎲</span>
        <h2 class="display" data-i18n="menuStratTitle"></h2>
        <p data-i18n="menuStratDesc"></p>
      </button>
      <button class="menu-card frame card-guess" onclick="showScreen('guessScreen'); startGuess(false)">
        <span class="beam"></span>
        <span class="glyph">🕵️</span>
        <h2 class="display" data-i18n="menuGuessTitle"></h2>
        <p data-i18n="menuGuessDesc"></p>
      </button>
      <button class="menu-card frame card-gallery" style="--c1:var(--flex)" onclick="showScreen('galleryScreen')">
        <span class="beam"></span>
        <span class="glyph">🖼️</span>
        <h2 class="display" data-i18n="menuGalleryTitle"></h2>
        <p data-i18n="menuGalleryDesc"></p>
      </button>
    </div>

    <div class="roster-note" id="rosterNote"></div>
  </section>

  <!-- ============ WHEEL ============ -->
  <section class="screen" id="wheelScreen" style="--tint:var(--gold)">
    <div class="topbar">
      <button class="icon-btn" onclick="showScreen('home')" aria-label="Back">‹</button>
      <h2 class="display screen-title" data-i18n="wheelTitle"></h2>
      <div class="top-right">
        <button class="icon-btn lang lang-btn" onclick="toggleLang()">EN</button>
        <button class="icon-btn sound-btn" onclick="toggleSound()" aria-label="Sound">🔊</button>
      </div>
    </div>

    <div class="wheel-layout">
      <div class="wheel-left">
        <div class="legend">
          <span><span class="dot" style="background:var(--van)"></span>Vanguard</span>
          <span><span class="dot" style="background:var(--duel)"></span>Duelist</span>
          <span><span class="dot" style="background:var(--strat)"></span>Strategist</span>
          <span><span class="dot" style="background:var(--flex)"></span>Multi</span>
        </div>
        <div class="wheel-stage">
          <div class="wheel-glow"></div>
          <canvas id="wheel"></canvas>
          <div class="pointer" id="pointer"></div>
          <div class="hub"><span data-i18n="hubLabel"></span><b id="hubCount">51</b></div>
        </div>
      </div>

      <div class="wheel-right">
        <div class="mode-toggle" role="group" aria-label="Mode">
          <button id="modeSimple" class="on" onclick="setMode('simple')" data-i18n="modeSimple"></button>
          <button id="modeMixed" onclick="setMode('mixed')" data-i18n="modeMixed"></button>
        </div>
        <div class="mode-hint" id="modeHint"></div>

        <div class="actions">
          <button class="btn big" id="spinBtn" onclick="spin()" data-i18n="spinBtn"></button>
        </div>

        <div class="bench">
          <div class="bench-head">
            <h3 data-i18n="benchTitle"></h3>
            <button id="resetBtn" onclick="resetBench()" hidden data-i18n="resetBtn"></button>
          </div>
          <div class="chips" id="benchChips"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ STRAT ============ -->
  <section class="screen" id="stratScreen" style="--tint:var(--strat)">
    <div class="topbar">
      <button class="icon-btn" onclick="showScreen('home')" aria-label="Back">‹</button>
      <h2 class="display screen-title" data-i18n="stratTitle"></h2>
      <div class="top-right">
        <button class="icon-btn lang lang-btn" onclick="toggleLang()">EN</button>
        <button class="icon-btn sound-btn" onclick="toggleSound()" aria-label="Sound">🔊</button>
      </div>
    </div>

    <div class="strat-stage">
      <div class="strat-idle" id="stratIdle">
        <span class="big-icon">🎲</span>
        <span data-i18n="stratIdle"></span>
      </div>

      <div class="shuffler" id="shuffler">
        <div class="display cycling" id="cyclingText">…</div>
      </div>

      <div class="strat-card frame" id="stratCard">

        <h3 class="display strat-title" id="stratTitle2"></h3>
        <p class="strat-desc" id="stratDesc"></p>
        <div class="strat-heroes" id="stratHeroes"></div>
      </div>

      <button class="btn big teal" id="stratBtn" onclick="rollStrat()"></button>
      <button class="btn ghost" onclick="showScreen('libScreen')" data-i18n="libBtn"></button>
    </div>
  </section>

        <button class="icon-btn lang lang-btn" onclick="toggleLang()">EN</button>

        <button class="icon-btn lang lang-btn" onclick="toggleLang()">EN</button>
        <button class="icon-btn sound-btn" onclick="toggleSound()" aria-label="Sound">🔊</button>
      </div>
    </div>
    <div class="gal-filter" id="galFilter"></div>
    <div class="gal-count" id="galCount"></div>
    <div class="gallery-grid" id="galleryGrid"></div>
  </section>

  <!-- ============ GUESS ============ -->

    <div class="topbar">
      <button class="icon-btn" onclick="showScreen('home')" aria-label="Back">‹</button>
      <h2 class="display screen-title" data-i18n="guessTitle"></h2>
      <div class="top-right">
        <button class="icon-btn lang lang-btn" onclick="toggleLang()">EN</button>
        <button class="icon-btn sound-btn" onclick="toggleSound()" aria-label="Sound">🔊</button>
      </div>
    </div>

    <div class="guess-status">

      <button class="btn ghost" onclick="startGuess(true)" data-i18n="restartBtn"></button>
      <button class="btn ghost" id="giveUpBtn" onclick="giveUp()" data-i18n="giveUpBtn"></button>
    </div>

    <div class="guess-search" id="guessSearch">
      <input type="text" id="guessInput" autocomplete="off" autocorrect="off" spellcheck="false">
      <div class="suggestions" id="suggBox"></div>
    </div>

    <div class="guess-banner frame" id="guessBanner">
      <div class="avatar lg" id="bannerAvatar"><span>?</span></div>
      <h3 class="display" id="bannerTitle"></h3>
      <p id="bannerText"></p>
      <button class="btn red" onclick="startGuess(true)" data-i18n="playAgainBtn"></button>
    </div>

    <div class="guess-legend">
      <span><span class="sq" style="background:var(--ok)"></span><span data-i18n="lgOk"></span></span>
      <span><span class="sq" style="background:var(--part)"></span><span data-i18n="lgPart"></span></span>
      <span><span class="sq" style="background:var(--no)"></span><span data-i18n="lgNo"></span></span>
      <span data-i18n="lgArrows"></span>
    </div>

    <div class="board-scroll">
      <div class="board">
        <div class="board-head" id="boardHead"></div>
        <div id="boardRows"></div>
      </div>
    </div>
    <p class="guess-hint" id="guessHint"></p>
  </section>
</div>

<!-- ============ RESULT SHEET ============ -->
<div class="sheet-backdrop" id="backdrop" onclick="closeSheet(); closeHeroSheet()"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="resultName">
  <div class="grip"></div>
  <div class="result-top">
    <div class="avatar xl" id="resultAvatar"><span></span></div>
    <div>

      <h3 class="display result-name" id="resultName"></h3>
    </div>
  </div>
  <p class="result-info" id="resultInfo"></p>
  <div class="actions">
    <div class="actions-row">
      <button class="btn ghost" onclick="benchCurrent()" data-i18n="skipBtn"></button>
      <button class="btn ghost" onclick="closeSheet()" data-i18n="keepBtn"></button>
    </div>
    <button class="btn big" onclick="closeSheet(); spin()" data-i18n="spinAgainBtn"></button>
  </div>
</div>

</div>

let audioCtx = null, muted = false;
function ac(){
  if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}
function blip(freq, dur, type, vol, when=0){
  if(muted) return;
  try{
    const c = ac(), tt = c.currentTime + when;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, tt);
    g.gain.exponentialRampToValueAtTime(.0001, tt + dur);
    o.connect(g); g.connect(c.destination);
    o.start(tt); o.stop(tt + dur + .02);
  }catch(e){}
}
const sndTick   = ()=> blip(1900, .035, "square", .05);
const sndClick  = ()=> blip(1300, .04,  "square", .05);

/* ===================================================== AVATARE / BILDER */
function slug(name){
  return name.toLowerCase().replace(/&/g,"and").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
}
function initials(name){
  return name.replace("&","").split(/\s+/).filter(w=>w).slice(0,2).map(w=>w[0].toUpperCase()).join("");
}
/* Kurznamen-Aliase für Bilddateien (falls Dateien verkürzte Namen tragen) */
const IMG_ALIASES = {
  "Devil Dinosaur":      ["devil-dino"],
  "Elsa Bloodstone":     ["elsa"],
  "Jeff the Land Shark": ["jeff"],
  "Mister Fantastic":    ["mr-fantastic"],
  "Rocket Raccoon":      ["rocket"],
  "The Punisher":        ["punisher"],
  "The Thing":           ["thing"],
  "Peni Parker":         ["peni"],
  "Winter Soldier":      ["bucky"],
  "Invisible Woman":     ["sue-storm"],
  "Adam Warlock":        ["warlock"]
};
/* Erzeugt alle Datei-Kandidaten: <name>{_|-}prestige (inkl. Tippfehler "restige"),
   danach der blanke Name – jeweils als .png/.jpg/.webp */
function imgCandidates(hero){
  if(hero.img) return [hero.img];
  const bases = [slug(hero.n), ...(IMG_ALIASES[hero.n]||[])];
  const out = [];
  for(const b of bases){
    for(const suf of ["_prestige","-prestige","_restige","-restige",""]){
      out.push("img/"+b+suf+".png");
    }
    out.push("img/"+b+".jpg", "img/"+b+".webp");
  }
  return out;
}
function avatarNode(hero, cls=""){
  const div = document.createElement("div");
  div.className = "avatar " + cls;
  div.style.setProperty("--ac", ROLES[hero.r].color);
  const candidates = imgCandidates(hero);
  let ci = 0;
  const img = document.createElement("img");
  img.alt = hero.n;
  img.loading = "lazy";
  img.onerror = ()=>{
    ci++;
    if(ci < candidates.length){ img.src = candidates[ci]; return; }
    img.remove();
    const s = document.createElement("span");
    s.textContent = initials(hero.n);
    div.appendChild(s);
  };
  img.src = candidates[0];
  div.appendChild(img);
  return div;
}
function setAvatar(el, hero){
  const extra = [...el.classList].filter(c=>c!=="avatar").join(" ");
  const fresh = avatarNode(hero, extra);
  fresh.id = el.id;
  el.replaceWith(fresh);
  return fresh;
}
const HERO_BY_NAME = Object.fromEntries(HEROES.map(h=>[h.n,h]));
/* Chip mit Mini-Bild + Name (für Strats & Bibliothek) */
function heroTagNode(name){
  const tag = document.createElement("span");
  tag.className = "hero-tag with-img";
  const h = HERO_BY_NAME[name];
  if(h) tag.appendChild(avatarNode(h,"xs"));
  const s = document.createElement("span");
  s.textContent = name;
  tag.appendChild(s);
  return tag;
}

/* =====================================================
   HINTERGRUND (Map-Bilder aus img/maps/)
   1) Auf GitHub Pages werden die Dateien AUTOMATISCH über die
      GitHub-API gefunden – neue Maps einfach in den Ordner legen.
   2) Fällt die API aus, greift die Liste MAP_IMAGES unten.
   3) Zusätzlich werden nummerierte Dateien (map-1.jpg …) gesucht.
   ===================================================== */
const MAP_FOLDERS = ["img/maps", "img/map img"]; // beide Ordnernamen werden unterstützt
const MAP_FILES = [
  "img_map_hallofdialia.png","img_map_hellfiregala_arakko.png","img_map_hydrabase_altar.png",
  "img_map_hydrabase_arsenal.png","img_map_hydrabase.png","img_map_hydracharterisbase.png",
  "img_map_hydraerebusbase.png","img_map_jeffland.png","img_map_klyntar_abyssthrone.png",
  "img_map_klyntar_ruins.png","img_map_krakoa_carousel.png","img_map_krakoa_cradle.png",
  "img_map_krakoa_grove.png","img_map_kunlun_heartoftiandu.png","img_map_kunlun_shenlongarena.png",
  "img_map_midtown.png","img_map_museum_collectorpark.png","img_map_newayo_acm.png",
  "img_map_newyork_manhattan.png","img_map_nuevayork_acm.png","img_map_practicerance.png",
  "img_map_randomnmap.png","img_map_sanctumsanctorum.png","img_map_thorny_jungle.png",
  "img_map_tokyowebworld_metropolis.png","img_map_tokyowebworld_shrine.png",
  "img_map_tokyowebworld_spiderisland.png","img_map_wakanda.png","img_map_yggdrasil_garden.png",
  "img_map_yggdrasil_throne.png","img_map_yggdrasil.png"
];
const MAP_INTERVAL = 18000; // Wechsel alle 18 Sekunden

async function discoverMaps(){
  // Auf *.github.io: Owner + Repo aus der URL ableiten und Ordner per API listen
  try{
    if(location.hostname.endsWith("github.io")){
      const owner = location.hostname.split(".")[0];
      const repo = location.pathname.split("/").filter(Boolean)[0];
      if(owner && repo){
        for(const folder of MAP_FOLDERS){
          const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${encodeURIComponent(folder).replace(/%2F/g,"/")}`);
          if(!res.ok) continue;
          const files = await res.json();
          const imgs = files
            .filter(f=>f.type==="file" && /\.(png|jpe?g|webp)$/i.test(f.name))
            .map(f=>folder+"/"+f.name);
          if(imgs.length) return imgs;
        }
      }
    }
  }catch(e){}
  return null; // API nicht verfügbar → Fallback nutzen
}

function initMapBackground(){
  const tryLoad = src => new Promise(res=>{
    const im = new Image();
    im.onload = ()=>res(src);
    im.onerror = ()=>res(null);
    im.src = src;
  });

  (async ()=>{
    let found = await discoverMaps();
    if(!found){
      // Fallback 1: bekannte Dateinamen in beiden Ordnern durchprobieren
      found = [];
      for(const folder of MAP_FOLDERS){
        const manual = await Promise.all(MAP_FILES.map(f=>tryLoad(folder+"/"+f)));
        found.push(...manual.filter(Boolean));
        if(found.length) break;
      }
      // Fallback 2: nummerierte Dateien map-1.jpg/png/webp …
      for(const folder of MAP_FOLDERS){
        let misses = 0;
        for(let i=1;i<=30 && misses<3;i++){
          let hit = null;
          for(const ext of ["jpg","png","webp"]){
            hit = await tryLoad(`${folder}/map-${i}.${ext}`);
            if(hit) break;
          }
          if(hit){ found.push(hit); misses = 0; } else { misses++; }
        }
      }
    }
    if(found.length===0) return;

    // zufällige Reihenfolge, damit nicht immer dieselbe Map startet
    for(let i=found.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [found[i],found[j]] = [found[j],found[i]];
    }

    const box = document.getElementById("bgSlides");
    found.forEach((src,i)=>{
      const im = document.createElement("img");
      im.src = src; im.alt = ""; im.loading = "lazy";
      if(i===0) im.classList.add("on");
      box.appendChild(im);
    });
    document.body.classList.add("has-bg");
    if(found.length>1 && !matchMedia("(prefers-reduced-motion: reduce)").matches){
      let cur = 0;
      setInterval(()=>{
        const imgs = box.querySelectorAll("img");
        imgs[cur].classList.remove("on");
        cur = (cur+1) % imgs.length;
        imgs[cur].classList.add("on");
      }, MAP_INTERVAL);
    }
  })();
}

/* ===================================================== WHEEL */
const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");
let benched = new Set();
let mode = "simple";
let order = HEROES.map((_,i)=>i);
let rotation = -Math.PI/2;
let spinning = false;
let currentHero = null;
let lastTickSeg = -1;

function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function setMode(m){
  if(spinning || mode===m) return;
  mode = m;
  document.getElementById("modeSimple").classList.toggle("on", m==="simple");
  document.getElementById("modeMixed").classList.toggle("on", m==="mixed");
  document.getElementById("modeHint").textContent = m==="simple" ? t("hintSimple") : t("hintMixed");
  order = m==="simple" ? HEROES.map((_,i)=>i) : shuffle(HEROES.map((_,i)=>i));
  sndClick();
  drawWheel();
}
function activeHeroes(){
  return order.filter(i=>!benched.has(i)).map(i=>({...HEROES[i], idx:i}));
}
function wheelCss(){
  return window.innerWidth>=900 ? 440 : Math.min(window.innerWidth*0.86, 400);
}
function sizeCanvas(){
  const cssSize = wheelCss();
  const dpr = Math.min(window.devicePixelRatio||1, 2.5);
  canvas.style.width = cssSize+"px";
  canvas.style.height = cssSize+"px";
  canvas.width = cssSize*dpr;
  canvas.height = cssSize*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return cssSize;
}
function drawWheel(){
  const size = sizeCanvas();
  const c = size/2, R = c-4;
  const list = activeHeroes();
  const n = list.length;
  document.getElementById("hubCount").textContent = n;
  ctx.clearRect(0,0,size,size);
  if(n===0) return;

  const seg = (Math.PI*2)/n;
  for(let k=0;k<n;k++){
    const a0 = rotation + k*seg, a1 = a0+seg;
    const role = ROLES[list[k].r];
    ctx.beginPath();
    ctx.moveTo(c,c);
    ctx.arc(c,c,R,a0,a1);
    ctx.closePath();
    ctx.fillStyle = (k%2===0)? role.color : role.alt;
    ctx.fill();
    ctx.strokeStyle = "rgba(11,9,32,.6)";
    ctx.lineWidth = 1;
    ctx.stroke();

    const mid = a0+seg/2;
    ctx.save();
    ctx.translate(c,c);
    ctx.rotate(mid);
    ctx.textAlign = "right";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "rgba(11,9,32,.92)";
    const base = size/400;
    const fs = (n>44? 9 : n>34? 10 : n>24? 11.5 : 13) * base;
    ctx.font = `700 ${fs}px system-ui, sans-serif`;
    ctx.fillText(list[k].short || list[k].n, R-10, 0, R-60*base);
    ctx.restore();
  }
  ctx.beginPath(); ctx.arc(c,c,R,0,Math.PI*2);
  ctx.strokeStyle = "rgba(255,213,66,.85)"; ctx.lineWidth = 3; ctx.stroke();
  ctx.beginPath(); ctx.arc(c,c,R-5,0,Math.PI*2);
  ctx.strokeStyle = "rgba(245,243,255,.25)"; ctx.lineWidth = 1.2; ctx.stroke();
}
function segUnderPointer(n, seg){
  let a = (-Math.PI/2 - rotation) % (Math.PI*2);
  a = (a + Math.PI*2) % (Math.PI*2);
  return Math.floor(a/seg) % n;
}
function easeOutQuart(x){ return 1-Math.pow(1-x,4); }

function spin(){
  if(spinning) return;
  const list = activeHeroes();
  if(list.length<2){ resetBench(); return; }
  spinning = true;
  document.getElementById("spinBtn").disabled = true;

  const n = list.length;
  const seg = (Math.PI*2)/n;
  const winner = Math.floor(Math.random()*n);

  const targetMod = -Math.PI/2 - (winner+0.5)*seg;
  const currentMod = ((rotation % (Math.PI*2)) + Math.PI*2) % (Math.PI*2);
  let delta = ((targetMod - currentMod) % (Math.PI*2) + Math.PI*2) % (Math.PI*2);
  const turns = 5 + Math.floor(Math.random()*3);
  const total = delta + turns*Math.PI*2;

  const start = rotation;
  const dur = 4200 + Math.random()*600;
  const t0 = performance.now();
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  lastTickSeg = segUnderPointer(n, seg);

  function frame(now){
    const x = Math.min((now-t0)/(reduced? 200 : dur), 1);
    rotation = start + total*easeOutQuart(x);
    drawWheel();
    const cur = segUnderPointer(n, seg);
    if(cur !== lastTickSeg){ lastTickSeg = cur; sndTick(); }
    if(x<1){ requestAnimationFrame(frame); }
    else{
      rotation = start+total;
      drawWheel();
      spinning = false;
      document.getElementById("spinBtn").disabled = false;
      document.getElementById("pointer").classList.add("wobble");
      setTimeout(()=>document.getElementById("pointer").classList.remove("wobble"),520);
      currentHero = list[winner];
      sndFanfare();
      setTimeout(()=>{ fillSheet(currentHero); openSheet(); }, 380);
    }
  }
  requestAnimationFrame(frame);
}

/* ===================================================== STRATROULETTE */
let rolling = false, stratRolled = false, currentStrat = null;
function rollStrat(){
  if(rolling) return;
  rolling = true;
  const idle = document.getElementById("stratIdle");
  const shuf = document.getElementById("shuffler");
  const card = document.getElementById("stratCard");
  const btn  = document.getElementById("stratBtn");
  const cyc  = document.getElementById("cyclingText");
  idle.style.display = "none";
  card.classList.remove("show");
  shuf.classList.add("show");
  btn.disabled = true;

  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const pick = STRATS[Math.floor(Math.random()*STRATS.length)];
  if(reduced){ finish(); return; }

  let elapsed = 0, delay = 55;
  (function cycle(){
    cyc.textContent = STRATS[Math.floor(Math.random()*STRATS.length)].t[LANG];
    sndClick();
    elapsed += delay;
    delay *= 1.13;
    if(elapsed < 1700){ setTimeout(cycle, delay); }
    else{ finish(); }
  })();

  function finish(){
    shuf.classList.remove("show");
    currentStrat = pick;
    stratRolled = true;
    renderStratCard(pick);
    document.getElementById("stratCard").classList.add("show");
    sndPop();
    btn.disabled = false;
    btn.textContent = t("stratAgain");
    rolling = false;
  }
}

  document.getElementById("stratTitle2").textContent = s.t[LANG];
  document.getElementById("stratDesc").innerHTML = s.d[LANG];
  const hbox = document.getElementById("stratHeroes");

  const filterBox = document.getElementById("galFilter");
  filterBox.innerHTML = "";
  const opts = [["all", t("filterAll")], ...Object.entries(ROLES).map(([k,r])=>[k, r.name])];
  opts.forEach(([key,label])=>{
    const b = document.createElement("button");
    b.textContent = label;
    b.classList.toggle("on", galFilter===key);
    b.onclick = ()=>{ galFilter = key; sndClick(); renderGallery(); };
    filterBox.appendChild(b);
  });

  const heroes = HEROES
    .map((h,i)=>({...h, idx:i}))
    .filter(h=> galFilter==="all" || h.r===galFilter)
    .sort((a,b)=>a.n.localeCompare(b.n));
  document.getElementById("galCount").textContent = t("galCount")(heroes.length);

  const grid = document.getElementById("galleryGrid");
  grid.innerHTML = "";
  heroes.forEach((h,i)=>{
    const card = document.createElement("button");
    card.className = "gal-card";
    card.style.animationDelay = Math.min(i*0.015, .4)+"s";
    card.style.setProperty("--rc", ROLES[h.r].color);
    card.appendChild(avatarNode(h,"fill"));
    const nm = document.createElement("span");
    nm.className = "name";
    nm.textContent = h.n;
    card.appendChild(nm);
    const rl = document.createElement("span");
    rl.className = "role";
    rl.textContent = ROLES[h.r].name;
    card.appendChild(rl);
    card.onclick = ()=>openHeroSheet(h);
    grid.appendChild(card);
  });
}
function openHeroSheet(hero){
  currentDetail = hero;
  const role = ROLES[hero.r];
  const badge = document.getElementById("dtRole");
  badge.textContent = role.name;
  badge.style.setProperty("--rb", role.color);
  setAvatar(document.getElementById("dtAvatar"), hero);
  document.getElementById("dtName").textContent = hero.n;
  document.getElementById("dtInfo").innerHTML = hero.i[LANG];

  // Fähigkeiten
  const abBox = document.getElementById("dtAbilityList");
  abBox.innerHTML = "";
  (ABILITIES[hero.n]||[]).forEach(([an, de, en])=>{
    const rowEl = document.createElement("div");
    rowEl.className = "ab-row";
    rowEl.innerHTML = `<b>${an}</b><span>${LANG==="de"?de:en}</span>`;
    abBox.appendChild(rowEl);
  });

  // Steckbrief: gleiche Kategorien wie bei Guess the Character
  const cols = t("boardCols");
  const ex = heroExtra(hero);
  const rows = [
    [cols[1], attr("g", hero.g)],
    [cols[2], attr("sp", hero.sp)],
    [cols[3], hero.af.map(a=>attr("af",a)).join(", ")],
    [cols[4], role.name],
    [cols[5], attr("atk", ex.atk)],
    [cols[6], attr("fly", ex.fly)],
    [cols[7], seasonLabel(ex.se)],
    [t("dtRange"), attr("rg", hero.rg)],
    [cols[8], "~"+hero.hp]
  ];
  document.getElementById("dtStats").innerHTML =
    rows.map(([k,v])=>`<div class="stat-row"><span class="k">${k}</span><span class="v">${v}</span></div>`).join("");

  // In welchen Strats taucht der Held namentlich auf?
  const feat = STRATS.filter(s=> s.h && s.h.includes(hero.n));
  const wrap = document.getElementById("dtFeaturedWrap");
  const box = document.getElementById("dtFeatured");
  box.innerHTML = "";
  wrap.style.display = feat.length ? "" : "none";
  feat.forEach(s=>{
    const tag = document.createElement("span");
    tag.className = "hero-tag";
    tag.textContent = s.t[LANG];
    box.appendChild(tag);
  });

  document.getElementById("backdrop").classList.add("show");
  document.getElementById("heroSheet").classList.add("show");
  sndClick();
}
function closeHeroSheet(){
  currentDetail = null;
  document.getElementById("heroSheet").classList.remove("show");
  if(!document.getElementById("sheet").classList.contains("show")){
    document.getElementById("backdrop").classList.remove("show");
  }
}

/* ===================================================== GUESS THE CHARACTER */
let target = null;
let guessed = [];          // Reihenfolge der geratenen Hero-Indizes (neueste zuerst)
let guessOver = false;
let guessWon = false;

function startGuess(fresh){
  if(!fresh && target && !guessOver) return;
  target = HEROES[Math.floor(Math.random()*HEROES.length)];
  guessed = [];
  guessOver = false; guessWon = false;
  document.getElementById("tryCount").textContent = "0";
  document.getElementById("boardRows").innerHTML = "";
  document.getElementById("guessBanner").classList.remove("show");
  document.getElementById("giveUpBtn").disabled = false;
  const inp = document.getElementById("guessInput");
  inp.value = ""; inp.disabled = false;
  if(fresh) sndClick();
}

const inp = document.getElementById("guessInput");
const suggBox = document.getElementById("suggBox");
inp.addEventListener("input", renderSuggestions);
inp.addEventListener("focus", renderSuggestions);
document.addEventListener("click", e=>{
  if(!document.getElementById("guessSearch").contains(e.target)) suggBox.classList.remove("show");
});

function renderSuggestions(){
  const q = inp.value.trim().toLowerCase();
  suggBox.innerHTML = "";
  if(guessOver){ suggBox.classList.remove("show"); return; }
  const matches = HEROES
    .map((h,i)=>({...h, idx:i}))
    .filter(h=>!guessed.includes(h.idx) && h.n.toLowerCase().includes(q))
    .sort((a,b)=>a.n.localeCompare(b.n)); // komplette Liste, alphabetisch – Dropdown ist scrollbar
  if(matches.length===0){ suggBox.classList.remove("show"); return; }
  matches.forEach(h=>{
    const b = document.createElement("button");
    b.className = "sugg";
    b.appendChild(avatarNode(h,"sm"));
    const name = document.createElement("span");
    name.textContent = h.n;
    b.appendChild(name);
    const role = document.createElement("span");
    role.className = "role-mini";
    role.textContent = ROLES[h.r].name;
    b.appendChild(role);
    b.onclick = ()=>makeGuess(h.idx);
    suggBox.appendChild(b);
  });
  suggBox.classList.add("show");
}

function cmpSet(a, b){
  const A = new Set(a), B = new Set(b);
  const inter = [...A].filter(x=>B.has(x));
  if(inter.length===A.size && inter.length===B.size) return "ok";
  if(inter.length>0 && !(A.has("none")&&B.has("none")&&inter.length===0)) return inter.length>0 ? "part" : "no";
  return "no";
}
function cmpHP(g, tg){
  if(g===tg) return {s:"ok", a:""};
  return {s: Math.abs(g-tg)<=50 ? "part" : "no", a: tg>g ? "↑" : "↓"};
}
function evalGuess(h){
  const he = heroExtra(h), te = heroExtra(target);
  return {
    g:  h.g===target.g ? "ok":"no",
    sp: h.sp===target.sp ? "ok":"no",
    af: cmpSet(h.af, target.af),
    r:  h.r===target.r ? "ok":"no",
    atk: he.atk===te.atk ? "ok" : (he.atk==="mixed"||te.atk==="mixed" ? "part":"no"),
    fly: he.fly===te.fly ? "ok":"no",
    se: he.se===te.se ? {s:"ok",a:""} : {s: Math.abs(he.se-te.se)<=1 ? "part":"no", a: te.se>he.se ? "↑":"↓"},
    hp: cmpHP(h.hp, target.hp)
  };
}
function buildRow(idx, animate){
  const h = HEROES[idx];
  const res = evalGuess(h);
  const row = document.createElement("div");
  row.className = "board-row";
  if(!animate) row.style.setProperty("--noanim","1");

  const ex = heroExtra(h);
  const heroCell = document.createElement("div");
  heroCell.className = "cell hero " + (h.n===target.n ? "ok" : "no");
  heroCell.appendChild(avatarNode(h,"sm"));
  const nm = document.createElement("span");
  nm.textContent = h.n;
  heroCell.appendChild(nm);
  row.appendChild(heroCell);

  const cells = [
    [res.g,  attr("g",h.g)],
    [res.sp, attr("sp",h.sp)],
    [res.af, h.af.map(a=>attr("af",a)).join(", ")],
    [res.r,  ROLES[h.r].name],
    [res.atk, attr("atk",ex.atk)],
    [res.fly, attr("fly",ex.fly)],
    [res.se.s, seasonLabel(ex.se)+(res.se.a?' <span class="arrow">'+res.se.a+'</span>':'')],
  ];
  cells.forEach(([cls,txt])=>{
    const c = document.createElement("div");
    c.className = "cell " + cls;
    c.innerHTML = txt;
    row.appendChild(c);
  });
  const hpCell = document.createElement("div");
  hpCell.className = "cell " + res.hp.s;
  hpCell.innerHTML = `${h.hp}<span class="arrow">${res.hp.a}</span>`;
  row.appendChild(hpCell);
  return row;
}
function renderBoard(){
  const box = document.getElementById("boardRows");
  box.innerHTML = "";
  guessed.forEach(idx=> box.appendChild(buildRow(idx, false)));
}
function makeGuess(idx){
  if(guessOver || guessed.includes(idx)) return;
  guessed.unshift(idx);
  const h = HEROES[idx];
  inp.value = "";
  suggBox.classList.remove("show");
  document.getElementById("tryCount").textContent = guessed.length;
  document.getElementById("boardRows").prepend(buildRow(idx, true));

  if(h.n === target.n){ endGuess(true); }
  else{
    const res = evalGuess(h);
    const anyHit = [res.g,res.sp,res.af,res.r,res.atk,res.fly,res.se.s,res.hp.s].some(v=>v==="ok"||v==="part");
    anyHit ? sndClick() : sndWrong();
  }
}
function giveUp(){
  if(guessOver || !target) return;
  endGuess(false);
}
function renderBanner(){
  setAvatar(document.getElementById("bannerAvatar"), target);
  document.getElementById("bannerTitle").innerHTML = guessWon ? t("bannerWin")(target.n) : t("bannerLose")(target.n);
  document.getElementById("bannerText").innerHTML = guessWon ? t("bannerWinText")(guessed.length, target.i[LANG]) : target.i[LANG];
}
function endGuess(won){
  guessOver = true; guessWon = won;
  inp.disabled = true;
  suggBox.classList.remove("show");
  document.getElementById("giveUpBtn").disabled = true;
  renderBanner();
  document.getElementById("guessBanner").classList.add("show");
  won ? sndFanfare() : sndBench();
}

/* ===================================================== INIT */
applyI18n();
initMapBackground();
window.addEventListener("resize", ()=>{ if(document.getElementById("wheelScreen").classList.contains("active")) drawWheel(); });
drawWheel();
</script>
